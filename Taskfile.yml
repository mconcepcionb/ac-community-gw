version: "3"

dotenv: [".env"]

vars:
  BINARY: ac-community-gw
  SERVER_PKG: ./cmd/server
  MIGRATIONS_DIR: migrations

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  run:
    desc: Run the gateway locally
    cmds:
      - go run {{.SERVER_PKG}}

  dev:
    desc: Run the API and the Vite dev server (HMR) together
    deps:
      - run
      - web:dev

  fake:ac:db:
    desc: Start the fake AzerothCore database fixture (MariaDB)
    cmds:
      - docker compose up -d --wait mariadb

  fake:ac:
    desc: Run the fake AzerothCore (database fixture + SOAP server) on 127.0.0.1:7878
    deps: [fake:ac:db]
    cmds:
      - go run ./cmd/fakeazerothcore -addr 127.0.0.1:7878 -user acgw -pass acgw

  build:
    desc: Build the API server binary into bin/
    cmds:
      - go build -trimpath -o bin/{{.BINARY}} {{.SERVER_PKG}}

  test:
    desc: Run the unit test suite
    cmds:
      - go test -count=1 ./...

  test:race:
    desc: Run the unit test suite with the race detector
    cmds:
      - go test -race -count=1 ./...

  test:integration:
    desc: Run integration tests (requires ACGW_DATABASE_URL and the MySQL fixtures)
    cmds:
      - go test -tags integration -count=1 -p 1 ./...

  coverage:
    desc: Run unit tests and report coverage over the measured set
    cmds:
      - go test -count=1 -coverprofile=coverage.txt ./...
      - go run ./cmd/covercheck -profile coverage.txt

  coverage:integration:
    desc: Report coverage over the measured set including the integration profile
    cmds:
      - go test -count=1 -coverprofile=coverage.txt ./...
      - go test -tags integration -count=1 -p 1 -coverprofile=coverage-integration.txt ./...
      - go run ./cmd/covercheck -profile coverage.txt -profile coverage-integration.txt

  coverage:check:
    desc: Fail when measured coverage drops below coverage.floor
    cmds:
      - go test -count=1 -coverprofile=coverage.txt ./...
      - go run ./cmd/covercheck -profile coverage.txt -floor coverage.floor

  fmt:
    desc: Format all Go source files
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Verify that all Go source files are gofmt-ed
    cmds:
      - go test ./internal/architecture/ -run TestSourceIsFormatted -count=1

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (see .golangci.yml)
    cmds:
      - golangci-lint run ./...

  check:
    desc: Format check, vet, lint, tests, coverage, race, OpenAPI drift and SPA checks
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test
      - task: test:race
      - task: coverage:check
      - task: openapi:check
      - task: web:check

  codegen:
    desc: Regenerate all generated code
    cmds:
      - task: codegen:sqlc

  codegen:sqlc:
    desc: Generate typed PostgreSQL access with sqlc
    cmds:
      - sqlc generate

  openapi:spec:
    desc: Generate api/swagger.yaml from Go annotations (swag) and normalize it
    cmds:
      - go tool swag init --v3.1 -g main.go -d ./cmd/server,./internal --parseInternal -o ./api --ot yaml --quiet
      - go run ./cmd/openapi-postprocess

  openapi:check:spec:
    desc: Verify api/swagger.yaml is up to date
    cmds:
      - task: openapi:spec
      - git diff --exit-code -- api/

  openapi:client:
    desc: Generate the typed TypeScript client from api/swagger.yaml
    dir: web
    cmds:
      - pnpm codegen:api

  openapi:
    desc: Regenerate the OpenAPI spec and the TypeScript client
    cmds:
      - task: openapi:spec
      - task: openapi:client

  openapi:check:
    desc: Verify the OpenAPI spec and the generated client are up to date
    cmds:
      - task: openapi:spec
      - task: openapi:client
      - git diff --exit-code -- api/ web/src/api/generated

  web:install:
    desc: Install SPA dependencies with pnpm
    dir: web
    cmds:
      - pnpm install

  web:dev:
    desc: Run the SPA dev server with API proxy
    dir: web
    cmds:
      - pnpm dev

  web:build:
    desc: Build the SPA into web/dist
    dir: web
    cmds:
      - pnpm build

  web:test:
    desc: Run SPA unit tests
    dir: web
    cmds:
      - pnpm test

  web:coverage:
    desc: Run SPA tests with coverage thresholds (see web/vite.config.ts)
    dir: web
    cmds:
      - pnpm test:coverage

  web:typecheck:
    desc: Type-check the SPA
    dir: web
    cmds:
      - pnpm typecheck

  web:lint:
    desc: Lint and format-check the SPA with Biome
    dir: web
    cmds:
      - pnpm lint

  web:format:
    desc: Format the SPA with Biome
    dir: web
    cmds:
      - pnpm format

  web:check:
    desc: SPA lint, typecheck and tests
    cmds:
      - task: web:lint
      - task: web:typecheck
      - task: web:test

  secrets:edit:
    desc: Edit an encrypted secret set with sops (ENV defaults to development)
    vars:
      ENV: '{{.ENV | default "development"}}'
    cmds:
      - sops secrets/{{.ENV}}.sops.env

  secrets:encrypt:
    desc: Encrypt a plaintext file (FROM defaults to .env) into secrets/<ENV>.sops.env
    vars:
      ENV: '{{.ENV | default "development"}}'
      FROM: '{{.FROM | default ".env"}}'
    cmds:
      - cp {{.FROM}} secrets/{{.ENV}}.sops.env
      - sops encrypt --input-type dotenv --output-type dotenv --in-place secrets/{{.ENV}}.sops.env

  secrets:decrypt:
    desc: Decrypt secrets/<ENV>.sops.env into .env (ENV defaults to development)
    vars:
      ENV: '{{.ENV | default "development"}}'
    cmds:
      - cmd: pwsh -NoProfile -File scripts/secrets/materialize.ps1 -Environment {{.ENV}}
        platforms: [windows]
      - cmd: sh scripts/secrets/materialize.sh {{.ENV}}
        platforms: [linux, darwin]

  secrets:check:
    desc: Fail if a plaintext secret or an age private key is tracked
    cmds:
      - cmd: pwsh -NoProfile -File scripts/secrets/check-no-plaintext.ps1
        platforms: [windows]
      - cmd: sh scripts/secrets/check-no-plaintext.sh
        platforms: [linux, darwin]

  db:up:
    desc: Start the development PostgreSQL container
    cmds:
      - docker compose up -d postgres

  db:down:
    desc: Stop the development PostgreSQL container
    cmds:
      - docker compose down

  db:migrate:
    desc: Apply all pending migrations (Goose)
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} postgres "{{.ACGW_DATABASE_URL}}" up

  db:rollback:
    desc: Roll back the most recent migration (Goose)
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} postgres "{{.ACGW_DATABASE_URL}}" down

  db:status:
    desc: Show migration status (Goose)
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} postgres "{{.ACGW_DATABASE_URL}}" status

  web:image:
    desc: Build the SPA reverse-proxy (Caddy) image
    cmds:
      - docker build -f web/Dockerfile -t ac-community-gw-web:local .

  docker:build:
    desc: Build the production API Docker image
    cmds:
      - docker build -t ac-community-gw:local .

  docker:up:
    desc: Start the development stack (proxy + app + postgres)
    cmds:
      - docker compose up --build -d

  docker:down:
    desc: Stop the development stack
    cmds:
      - docker compose down
