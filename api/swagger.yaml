info:
  description: |-
    REST gateway between community applications and AzerothCore.
    It hides the AzerothCore SOAP/CLI internals behind a typed, authenticated and authorized HTTP API.
  title: ac-community-gw API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/v1/admin/account-claims:
    get:
      description: Lists pending account claims (without the code hash). Requires
        the azeroth.admin.claims.read permission.
      operationId: azeroth.admin.account_claims.list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzerothAdminClaimsResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      summary: List account claims
      tags:
      - azeroth-account
  /api/v1/admin/annotations:
    get:
      description: Lists the staff annotations of one target, newest first. Requires
        gw.notes.read.
      operationId: admin.notes.list
      parameters:
      - description: target type (account, user, character)
        in: query
        name: target_type
        required: true
        schema:
          type: string
      - description: target identifier
        in: query
        name: target_id
        required: true
        schema:
          type: string
      - description: page size
        in: query
        name: limit
        schema:
          default: 50
          type: integer
      - description: page offset
        in: query
        name: offset
        schema:
          default: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnnotationsResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      summary: List annotations
      tags:
      - admin-notes
    post:
      description: Attaches a staff note to a target. Requires gw.notes.write.
      operationId: admin.notes.create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAnnotationRequest'
        description: annotation
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnnotation'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      summary: Create an annotation
      tags:
      - admin-notes
  /api/v1/admin/annotations/{id}:
    delete:
      description: Deletes an annotation. Authors may delete their own; gw.notes.manage
        may delete any. Requires gw.notes.write.
      operationId: admin.notes.delete
      parameters:
      - description: annotation id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
